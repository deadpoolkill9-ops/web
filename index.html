<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta content="max-age=200" http-equiv="Cache-Control">
    <meta content="noindex,nofollow" name="robots">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <style>
        body {
            background-color: #000;
            margin: 0px;
            padding: 0px;
        }
    </style>
</head>
<body>

<script type="text/javascript">
    // Función para obtener parámetros desde la URL
    function getParameterByName(name) {
        name = name.replace(/[\[]/, "\\[").replace(/[\]]/, "\\]");
        var regex = new RegExp("[\\?&]" + name + "=([^&#]*)");
        var results = regex.exec(location.search);
        return results === null ? "" : decodeURIComponent(results[1].replace(/\+/g, " "));
    }

    // Comprueba los parámetros para obtener el enlace codificado en Base64
    var embed = getParameterByName('embed') || getParameterByName('p') || getParameterByName('r') || false;

    // Si existe el parámetro 'embed', decodifica e inyecta el iframe
    if (embed) {
        document.write(
            '<iframe allow="encrypted-media" src="' + atob(embed) + '" ' +
            'width="100%" height="100%" name="iframe" id="iframe" ' +
            'frameborder="0" scrolling="no" style="position:absolute;" ' +
            'allowfullscreen=""></iframe>'
        );
    } else {
        document.write('<img class="embed-responsive-item" src="" width="100%" height="100%">');
    }
</script>

</body>
</html>
